[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "main"
version = "0.0.1"
description = "Product segmentation and demand forecasting on the M5 retail dataset. It classifies products by revenue (ABC) and demand variability (XYZ), identifies the products whose classification stays stable over time, and forecasts their share of unit sales over 28-day horizons using backtesting. Replenishment quantities are out of scope for this stage."
authors = [
  { name = "Jose Salas" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.12.0"

[tool.flit.module]
name = "src"

[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]
extend-exclude = [".pixi"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "ipywidgets>=8.1.9",
    "notebook>=7.6.3",
    "pytest>=9.1.1",
]
ds = [
    "catboost>=1.2.10",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
    "xgboost-cpu>=3.4.1",
]

